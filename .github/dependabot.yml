version: 2
updates:
  # Keeps the SHA-pinned actions in the workflows current; the version comments update with them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Minor and patch updates arrive as one grouped PR; each major gets its own. The npm ecosystem covers pnpm.
  # The cooldown matches minimumReleaseAge in pnpm-workspace.yaml, so a PR never proposes a version pnpm refuses.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      npm:
        patterns: ['*']
        update-types: ['minor', 'patch']
