# pnpm settings (pnpm reads only auth and registry settings from .npmrc). The reasons are in docs/SECURITY.md.

# Don't install a version until it has been public for three days, when most hijacked releases are caught.
minimumReleaseAge: 4320

# Refuse a version whose publish trust (provenance, trusted publishing) is lower than an earlier version's.
trustPolicy: no-downgrade

# Transitive dependencies must come from the registry, not git URLs or tarballs.
blockExoticSubdeps: true

# Dependency build scripts don't run unless the package is listed here; installing fails if one is unlisted.
strictDepBuilds: true
